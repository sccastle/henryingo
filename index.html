<style>
:root{
  --paper:#F4F8F2; --card:#FFF; --ink:#1E2A22; --soft:#6E8177; --line:#DCE6DC;
  --green:#4E9B63; --green-d:#2F6B45; --green-l:#E8F3E9; --sun:#F2B33D;
  --shadow:0 1px 2px rgba(30,42,34,.06),0 6px 18px rgba(30,42,34,.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);overflow:hidden;user-select:none;
  font:16px/1.5 "Century Gothic","Avenir Next",Futura,"Trebuchet MS",-apple-system,"PingFang SC",sans-serif;
  display:flex;flex-direction:column}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}

/* ---------- 顶栏 ---------- */
#bar{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;flex:none}
#bar .ava{width:34px;height:34px;border-radius:10px;display:block;flex:none}
#bar .ttl{font-weight:700;font-size:16px}
#bar .crumb{font-size:12px;color:var(--soft)}
#bar .back{margin-left:auto;font-size:14px;color:var(--soft);padding:7px 13px;
  border:1px solid var(--line);border-radius:10px;background:#fff}

main{flex:1;min-height:0;overflow-y:auto;padding:0 14px 20px}
.screen{display:none}.screen.on{display:block}

/* ---------- 首页 ---------- */
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:70vh;text-align:center;gap:4px}
.home img{width:min(46vw,190px);border-radius:28px;box-shadow:var(--shadow)}
.home h1{font-size:clamp(30px,8vw,42px);margin-top:16px;letter-spacing:.01em}
.home p{color:var(--soft);font-size:14px;margin-bottom:22px}
.home .big{width:min(78vw,320px);padding:15px;border-radius:15px;background:var(--green);
  color:#fff;font-weight:700;font-size:18px;box-shadow:var(--shadow)}
.home .ghost{width:min(78vw,320px);padding:13px;border-radius:15px;background:#fff;
  border:1px solid var(--line);font-weight:600;margin-top:10px}

/* ---------- 菜单卡片 ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px}
.mcard{background:var(--card);border-radius:17px;padding:20px 14px;box-shadow:var(--shadow);
  text-align:center;border:2px solid transparent}
.mcard .ic{font-size:34px;line-height:1.1}
.mcard .nm{font-weight:700;margin-top:8px;font-size:17px}
.mcard .sub{font-size:11.5px;color:var(--soft);margin-top:3px}
.mcard:active{transform:scale(.98)}

/* ---------- 通用 ---------- */
.tip{font-size:12.5px;color:var(--soft);margin:4px 2px 9px}
.task{background:var(--card);border-radius:15px;padding:12px 14px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:11px;margin-bottom:10px}
.task .big{flex:none;width:50px;height:50px;border-radius:50%;background:var(--green);
  color:#fff;display:grid;place-items:center;font-size:21px}
.task .txt{font-size:clamp(18px,4.4vw,24px);font-weight:600;line-height:1.25;flex:1}
.task .txt.hidden{color:transparent;background:#EAF0EA;border-radius:7px;min-height:1.2em}
.eye{flex:none;width:36px;height:36px;border-radius:50%;background:var(--green-l);
  color:var(--green-d);display:grid;place-items:center;font-size:15px}
.next{margin-left:auto;background:var(--green);color:#fff;padding:11px 20px;border-radius:12px;font-weight:600}
.after{margin-top:11px;display:flex;gap:10px;align-items:center}
.verdict{font-weight:600}.verdict.ok{color:var(--green-d)}

.scene{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#DDEAF2}
.scene img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ch{position:absolute;bottom:4%;transform:translateX(-50%)}
.ch img{height:100%;display:block;pointer-events:none}
.ch.flip img{transform:scaleX(-1)}
.pt{position:absolute;transform:translate(-50%,-50%);border-radius:50%}
.hot{width:20%;aspect-ratio:1}
.ring{width:20%;aspect-ratio:1;border:5px solid var(--sun);
  box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 16px rgba(242,179,61,.75);
  animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.13)}}
.obj{position:absolute;transform:translate(-50%,-50%);line-height:1;
  font-size:calc(var(--u,300px)*.17);filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.obj.free{cursor:pointer}
.pair{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:720px){.pair{grid-template-columns:1fr 1fr}}
.opt{background:var(--card);border-radius:15px;padding:7px;box-shadow:var(--shadow);
  border:3px solid transparent;transition:border-color .15s}
.opt.right{border-color:var(--green)}
.opt.wrong{border-color:#CDD8CE;opacity:.5}

/* ---------- 词 ---------- */
.wcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px;
  display:grid;place-items:center;min-height:150px;position:relative}
.wemoji{font-size:clamp(86px,26vw,140px);line-height:1}
.wfig{position:relative;height:clamp(170px,32vh,250px)}
.wfig img{height:100%;display:block}
.wword{font-size:clamp(34px,9vw,52px);font-weight:700}
.wzh{font-size:clamp(32px,8.5vw,48px);font-weight:700;color:var(--green-d);text-align:center}
.wok{display:none;text-align:center;font-size:clamp(22px,6vw,30px);font-weight:700;
  color:var(--green-d);background:var(--green-l);border-radius:14px;padding:10px;margin-bottom:9px;
  animation:pop .35s ease}
.wok.on{display:block}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.wspk{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;
  background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-size:15px}
.wopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.wopts.one{grid-template-columns:1fr}
.wopt{background:var(--card);border:2px solid var(--line);border-radius:13px;padding:13px 10px;
  font-size:18px;font-weight:600;box-shadow:var(--shadow);text-align:center;position:relative}
.wopt .zh{display:block;font-size:12px;font-weight:400;color:var(--soft);margin-top:3px;min-height:0}
.wopt.pic{padding:5px;display:grid;place-items:center;min-height:118px;font-size:58px}
.wopt.pic img{height:104px;display:block}
.wopt.right{border-color:var(--green);background:var(--green-l)}
.wopt.wrong{border-color:#D8B3B0;background:#FBF1F0;opacity:.75}
.wopt .ab{position:absolute;left:9px;top:9px;font-size:11px;color:var(--soft);font-weight:700}

/* ---------- 说 ---------- */
.subtabs{display:flex;gap:4px;background:#E4EDE5;padding:3px;border-radius:11px;
  width:fit-content;margin:0 0 9px}
.subtabs button{padding:6px 13px;border-radius:9px;font-size:14px;color:var(--soft)}
.subtabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.slots{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 3px}
.slot{background:var(--card);border-radius:12px;padding:9px 13px;box-shadow:var(--shadow);
  font-size:18px;font-weight:600;display:flex;align-items:center;gap:7px}
.slot small{font-size:10.5px;color:var(--soft);font-weight:400}
.bank h3{font-size:11.5px;color:var(--soft);font-weight:600;margin:12px 0 6px;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:11px;padding:7px 12px;
  font-size:15px;font-weight:600}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.saybar{display:flex;gap:9px;margin-top:13px}
.saybar button{flex:1;padding:13px;border-radius:12px;font-weight:600;font-size:16px}
.saybar .read{background:var(--green);color:#fff}
.saybar .did{background:#fff;border:2px solid var(--line)}

/* ---------- 设置 ---------- */
.set{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:11px}
.set h3{font-size:13px;color:var(--soft);margin-bottom:9px;font-weight:700;letter-spacing:.04em}
.set .row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.set input,.set select{flex:1;font:inherit;padding:9px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);min-width:0}
.set .seg{display:flex;gap:6px}
.set .seg button{flex:1;padding:10px;border-radius:11px;border:2px solid var(--line);
  background:#fff;font-weight:600;font-size:14px}
.set .seg button.on{background:var(--green);border-color:var(--green);color:#fff}
.set .note{font-size:11.5px;color:var(--soft);margin-top:6px;line-height:1.55}
.set .mini{padding:8px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font-size:14px;flex:none}

/* ---------- 回首页确认 ---------- */
#confirm{position:fixed;inset:0;background:rgba(30,42,34,.5);display:none;
  align-items:center;justify-content:center;padding:26px;z-index:50}
#confirm.on{display:flex}
#confirm .box{background:#fff;border-radius:20px;padding:24px;text-align:center;
  max-width:330px;width:100%;box-shadow:0 18px 40px rgba(0,0,0,.2)}
#confirm img{width:88px;border-radius:20px}
#confirm p{font-size:19px;font-weight:700;margin:14px 0 18px}
#confirm .btns{display:flex;gap:10px}
#confirm .btns button{flex:1;padding:12px;border-radius:12px;font-weight:600}
#confirm .stay{background:#fff;border:2px solid var(--line)}
#confirm .go{background:var(--green);color:#fff}
</style>
</head>

      <h1>Henryingo</h1>
      <p>Let's learn and play!</p>
      <button class="big" id="go-play">▶　开始</button>
      <button class="ghost" id="go-set">⚙　设置</button>
    </div>
  </section>

  <!-- ============ 练习菜单 ============ -->
  <section class="screen" id="sc-menu">
    <div class="grid2">
      <button class="mcard" data-go="word"><div class="ic">🔤</div>
        <div class="nm">词</div><div class="sub">看图认词</div></button>
      <button class="mcard" data-go="listen"><div class="ic">🎧</div>
        <div class="nm">听</div><div class="sub">听指令做动作</div></button>
      <button class="mcard" data-go="read"><div class="ic">📖</div>
        <div class="nm">读</div><div class="sub">看句子选图</div></button>
      <button class="mcard" data-go="say"><div class="ic">🎤</div>
        <div class="nm">说</div><div class="sub">自己造句子</div></button>
    </div>
  </section>

  <!-- ============ 词的分类 ============ -->
  <section class="screen" id="sc-wordcat">
    <div class="grid2">
      <button class="mcard" data-cat="emo"><div class="ic">😊</div>
        <div class="nm">Feelings</div><div class="sub">情绪</div></button>
      <button class="mcard" data-cat="noun"><div class="ic">🍎</div>
        <div class="nm">Nouns</div><div class="sub">名词</div></button>
      <button class="mcard" data-cat="verb"><div class="ic">🏃</div>
        <div class="nm">Verbs</div><div class="sub">动作</div></button>
      <button class="mcard" data-cat="body"><div class="ic">✋</div>
        <div class="nm">Body</div><div class="sub">身体</div></button>
      <button class="mcard" data-cat="adj"><div class="ic">⭐</div>
        <div class="nm">Adjectives</div><div class="sub">形容词</div></button>
      <button class="mcard" data-cat="num"><div class="ic">🔢</div>
        <div class="nm">Numbers</div><div class="sub">数字颜色</div></button>
      <button class="mcard" data-cat="people"><div class="ic">👨‍👩‍👦</div>
        <div class="nm">People</div><div class="sub">家人朋友</div></button>
      <button class="mcard" data-cat="time"><div class="ic">📅</div>
        <div class="nm">Time</div><div class="sub">星期与时间</div></button>
      <button class="mcard" data-cat="phrase" style="grid-column:1/-1"><div class="ic">💬</div>
        <div class="nm">Everyday</div><div class="sub">日常用语</div></button>
      <button class="mcard" data-cat="all" style="grid-column:1/-1"><div class="ic">🎲</div>
        <div class="nm">全部混合</div><div class="sub">随机出题</div></button>
    </div>
  </section>

  <!-- ============ 设置 ============ -->
  <section class="screen" id="sc-settings">
    <div class="set">
      <h3>朗读</h3>
      <div class="row"><span style="color:var(--soft);flex:none;width:44px">声音</span>
        <select id="voice"></select></div>
      <div class="row"><span style="color:var(--soft);flex:none;width:44px">语速</span>
        <input id="rate" type="range" min="45" max="100" step="5">
        <b id="ratev" style="width:36px;text-align:right"></b>
        <button class="mini" id="try">试听</button></div>
      <div class="note">用的是手机自带的英语语音。安卓可在系统设置里搜"文字转语音"，
        把英语语音包下载成高质量版本，读音会清楚很多。</div>
    </div>

    <div class="set">
      <h3>词库难度</h3>
      <div class="seg" id="lvseg">
        <button data-lv="1">Starter</button>
        <button data-lv="2">Basic</button>
        <button data-lv="3">Advanced</button>
      </div>
      <div class="note" id="lvnote"></div>
    </div>

    <div class="set">
      <h3>AI（可选）</h3>
      <div class="row"><input id="apikey" type="password" placeholder="DeepSeek API key（sk-...）"></div>
      <div class="note">填了之后，「说 → 自己搭」里可以直接用中文说一句话，
        画面会照着搭出来。key 只存在这台设备的浏览器里，不会上传。</div>
    </div>
  </section>

  <!-- ============ 活动 ============ -->
  <section class="screen" id="sc-play">

    <!-- 词 -->
    <div class="view" id="v-word" style="display:none">
      <div class="tip" id="w-tip"></div>
      <div class="wok" id="w-ok"></div>
      <div class="wcard" id="w-card"><button class="wspk" id="w-spk">🔊</button></div>
      <div class="wopts" id="w-opts"></div>
      <div class="after" id="w-after" style="display:none">
        <button class="next" id="w-next" style="margin-left:0;width:100%">下一个 ▶</button>
      </div>
    </div>

    <!-- 听 -->
    <div class="view" id="v-listen" style="display:none">
      <div class="task">
        <button class="big" id="l-play">🔊</button>
        <div class="txt hidden" id="l-txt"></div>
        <button class="eye" id="l-eye">👁</button>
      </div>
      <div class="tip" id="l-tip"></div>
      <div class="opt" style="border-color:transparent"><div class="scene" id="l-scene"></div></div>
      <div class="after" id="l-after" style="display:none">
        <span class="verdict" id="l-verdict"></span>
        <button class="next" id="l-next">下一个</button>
      </div>
    </div>

    <!-- 读 -->
    <div class="view" id="v-read" style="display:none">
      <div class="task"><div class="txt" id="r-txt"></div><button class="eye" id="r-say">🔊</button></div>
      <div class="tip">哪张图是这句话说的？</div>
      <div class="pair" id="r-pair"></div>
      <div class="after" id="r-after" style="display:none">
        <span class="verdict" id="r-verdict"></span>
        <button class="next" id="r-next">下一题</button>
      </div>
    </div>

    <!-- 说 -->
    <div class="view" id="v-say" style="display:none">
      <div class="subtabs">
        <button id="m-free" class="on">自己搭</button>
        <button id="m-zh">照中文说</button>
      </div>
      <div class="tip" id="s-tip"></div>
      <div class="bank" id="s-bank"></div>
      <div class="opt" style="border-color:transparent;margin-top:12px">
        <div class="scene" id="s-scene"></div></div>
      <div class="slots" id="s-slots"></div>
      <div class="saybar" id="s-bar"></div>
    </div>

  </section>
</main>

/* ================= 朗读 ================= */
var Say=(function(){
  var list=[],voice=null,rate=0.72;
  function load(){
    if(!("speechSynthesis" in window)) return;
    try{ list=(speechSynthesis.getVoices()||[]).filter(function(x){return /^en/i.test(x.lang);}); }
    catch(e){ list=[]; }
    if(!voice){
      voice=list.find(function(x){return /^en-US/i.test(x.lang)&&/natural|enhanced|premium|google/i.test(x.name);})
          ||list.find(function(x){return /^en-US/i.test(x.lang);})||list[0]||null;
    }
  }
  function speak(t,r){
    if(!("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();
      try{ speechSynthesis.resume(); }catch(e){}
      var u=new SpeechSynthesisUtterance(t);
      if(voice) u.voice=voice;
      u.lang=voice?voice.lang:"en-US";
      u.rate=r||rate; u.pitch=1.03; u.volume=1;
      setTimeout(function(){ try{ speechSynthesis.speak(u); }catch(e){} }, 60);
    }catch(e){}
  }
  speak.stop=function(){ try{speechSynthesis.cancel();}catch(e){} };
  speak.reload=load;
  speak.voices=function(){ return list; };
  speak.pickVoice=function(n){ var f=list.find(function(x){return x.name===n;}); if(f) voice=f; };
  speak.current=function(){ return voice?voice.name:""; };
  speak.setRate=function(r){ rate=r; };
  speak.rate=function(){ return rate; };
  load();
  return speak;
})();

function bump(){ /* 统计不再显示，保留接口 */ }

/* 一轮之内不重复：抽完一整轮才重新洗牌 */
const QUEUE={};
function nextOf(name,list){
  if(!list.length) return null;
  const q=QUEUE[name];
  if(!q || q.sig!==list.length+"|"+list[0] || !q.rest.length)
    QUEUE[name]={sig:list.length+"|"+list[0], rest:shuffle(list.slice())};
  return QUEUE[name].rest.pop();
}

/* ================= 场景合成 ================= */
function poseImg(cid,p){
  const m=A(cid).kind==="animal"?RAY:POSE;
  const set=(IMG.ch||{})[sprite(cid)]||{};
  return src(set[m[p]||m.neutral]||set["01"]);
}
const RO=("ResizeObserver" in window)?new ResizeObserver(function(es){
  es.forEach(function(e){ const h=e.contentRect.height; if(h) e.target.style.setProperty("--u",h+"px"); });
}):null;
function watch(el){ if(RO) RO.observe(el); if(el.clientHeight) el.style.setProperty("--u",el.clientHeight+"px"); }
function setBG(scene,bg){
  scene.innerHTML=""; watch(scene);
  if(!IMG.bg||!IMG.bg[bg]) return;
  const i=document.createElement("img"); i.className="bg"; i.src=src(IMG.bg[bg]); scene.appendChild(i);
}
function addChar(scene,cid,pose,x,flip){
  const w=document.createElement("div");
  w.className="ch"+(flip?" flip":"");
  w.style.height=(A(cid).scale*84)+"%"; w.style.left=x+"%";
  const img=document.createElement("img"); img.src=poseImg(cid,pose);
  w.appendChild(img); scene.appendChild(w); return w;
}
function at(w,cid,part){
  const a=(ANCHORS[sprite(cid)]||{})[part]; if(!a) return null;
  return [(w.classList.contains("flip")?1-a[0]:a[0])*100, a[1]*100];
}
function pin(w,cid,part,cls){
  const p=at(w,cid,part); if(!p) return null;
  const d=document.createElement("div"); d.className="pt "+cls;
  d.style.left=p[0]+"%"; d.style.top=p[1]+"%"; w.appendChild(d); return d;
}
/* 物品落在哪：踢用脚，喝和吃靠嘴，其余用该姿势的手 */
const ATTACH={kick:"foot",drink:"mouth",eat:"mouth"};
function hold(w,cid,emoji,pose){
  let p=null;
  const where=ATTACH[pose];
  if(where){ p=at(w,cid,where); }
  if(!p){
    const key=(A(cid).kind==="animal"?RAY:POSE)[pose];
    const h=key&&(HANDS[sprite(cid)]||{})[key];
    if(h) p=[(w.classList.contains("flip")?1-h[0]:h[0])*100, h[1]*100];
  }
  if(!p) p=at(w,cid,"handSlot");
  if(!p) return;
  const d=document.createElement("div");
  d.className="obj"; d.textContent=emoji;
  d.style.left=p[0]+"%"; d.style.top=p[1]+"%";
  w.appendChild(d);
}

/* ================= 词 ================= */
function lvOK(lv){ return lv<=(DB.lv||1); }
function wordPool(cat){
  const out=[];
  if(cat==="noun"||cat==="all")
    Object.keys(NOUNS).filter(k=>lvOK(NOUNS[k].lv)).forEach(k=>out.push({k,type:"noun"}));
  if(cat==="verb"||cat==="all")
    Object.keys(VERBS_W).filter(k=>lvOK(VERB_LV[k]||3)).forEach(k=>out.push({k,type:"verb"}));
  if(cat==="adj" ||cat==="all")
    Object.keys(ADJ_W).filter(k=>lvOK(ADJ_LV[k]||3)).forEach(k=>out.push({k,type:"adj"}));
  if(cat==="people"||cat==="all")
    Object.keys(PEOPLE_W).filter(k=>lvOK(PEOPLE_LV[k]||3)).forEach(k=>out.push({k,type:"people"}));
  if(cat==="time"||cat==="all")
    Object.keys(TIME_W).filter(k=>lvOK(TIME_LV[k]||3)).forEach(k=>out.push({k,type:"adj"}));
  if(cat==="phrase"||cat==="all")
    Object.keys(PHRASE_W).filter(k=>lvOK(PHRASE_LV[k]||3)).forEach(k=>out.push({k,type:"adj"}));
  if(cat==="num")
    Object.keys(NOUNS).filter(k=>lvOK(NOUNS[k].lv)&&(NOUNS[k].t.includes("num")||NOUNS[k].t.includes("color")))
      .forEach(k=>out.push({k,type:"noun"}));
  if(cat==="body"||cat==="all") BODY_W.forEach(k=>out.push({k,type:"body"}));
  if(cat==="emo" ||cat==="all") Object.keys(EMO_W).forEach(k=>out.push({k,type:"emo"}));
  return out;
}
let WCAT="all", W=null, WTRIED=false;

function figureFor(item,cid){
  const box=document.createElement("div");
  if(item.type==="noun"){ box.className="wemoji"; box.textContent=EMO(item.k); return box; }
  if(item.type==="people"){ box.className="wemoji"; box.textContent=PEOPLE_E[item.k]||"🧑"; return box; }
  if(item.type==="adj" || (item.type==="verb" && !POSE[item.k])){
    box.className="wzh"; box.textContent=ZH[item.k]||""; return box;
  }
  box.className="wfig";
  const im=document.createElement("img");
  im.src=poseImg(cid, POSE[item.k] ? item.k : "neutral");
  box.appendChild(im);
  return box;
}

function newWord(){
  Say.stop(); WTRIED=false;
  $("w-after").style.display="none";
  $("w-ok").classList.remove("on");
  const pool=wordPool(WCAT);
  const item=nextOf("word:"+WCAT+":"+(DB.lv||1), pool);
  if(!item) return;
  const cid=rnd(ALLCH);
  W={item,cid};
  const card=$("w-card"), opts=$("w-opts");
  card.innerHTML='<button class="wspk" id="w-spk">🔊</button>';
  opts.innerHTML=""; opts.className="wopts";

  /* 身体部位：图上一个金圈，四个文字选项 */
  if(item.type==="body"){
    $("w-tip").textContent="金圈圈的是哪里？";
    const wrap=figureFor(item,cid);
    const a=(ANCHORS[cid]||{})[item.k];
    if(a){ const d=document.createElement("div"); d.className="pt ring";
      d.style.left=a[0]*100+"%"; d.style.top=a[1]*100+"%"; d.style.width="26%";
      wrap.appendChild(d); }
    card.appendChild(wrap);
    const others=shuffle(BODY_W.filter(p=>p!==item.k&&(ANCHORS[cid]||{})[p])).slice(0,3);
    const all=shuffle([item.k].concat(others));
    opts.className="wopts one";
    all.forEach((p,i)=>{
      const b=document.createElement("button"); b.className="wopt";
      b.innerHTML='<span class="ab">'+"ABCD"[i]+'</span>'+CHARS[cid].en+"'s "+label(p)+
                  '<span class="zh"></span>';
      b.onclick=()=>wPick(b,p===item.k,opts,CHARS[cid].en+"的"+(BODY_ZH[p]||p),
                          CHARS[cid].en+"'s "+label(p));
      opts.appendChild(b);
    });
    $("w-spk").onclick=e=>{e.stopPropagation();Say(CHARS[cid].en+"'s "+label(item.k));};
    return;
  }

  const same=wordPool(item.type==="noun"?"noun":item.type==="people"?"people":item.type);
  const others=shuffle(same.filter(x=>x.k!==item.k)).slice(0,3);
  const all=shuffle([item].concat(others));
  const pictorial = item.type==="noun" || item.type==="people" || (item.type!=="adj" && POSE[item.k]);
  /* 有图：图 → 选英文；没图（形容词等）：中文 → 选英文 */
  const mode = pictorial ? (Math.random()<0.5 ? "pic2en" : "en2pic") : "zh2en";

  if(mode==="pic2en" || mode==="zh2en"){
    $("w-tip").textContent = pictorial ? "这是什么？" : "这个中文，英语怎么说？";
    card.appendChild(figureFor(item,cid));
    all.forEach((o,i)=>{
      const b=document.createElement("button"); b.className="wopt";
      b.innerHTML='<span class="ab">'+"ABCD"[i]+'</span>'+label(o.k)+'<span class="zh"></span>';
      b.onclick=()=>wPick(b,o.k===item.k,opts,ZH[o.k]||"",label(o.k));
      opts.appendChild(b);
    });
  }else{
    $("w-tip").textContent="哪一个是这个词？";
    const t=document.createElement("div"); t.className="wword"; t.textContent=label(item.k);
    card.appendChild(t);
    all.forEach((o,i)=>{
      const b=document.createElement("button"); b.className="wopt pic";
      b.appendChild(figureFor(o,cid));
      const z=document.createElement("span"); z.className="zh"; b.appendChild(z);
      b.onclick=()=>wPick(b,o.k===item.k,opts,label(o.k)+"　"+(ZH[o.k]||""),label(o.k));
      opts.appendChild(b);
    });
  }
  $("w-spk").onclick=e=>{e.stopPropagation();Say(label(item.k));};
}

/* 点错不结束：标出来、给中文、可以继续点，点中才过 */
function wPick(btn,ok,opts,zhText,sayText){
  if(btn.dataset.done) return;
  btn.dataset.done="1";
  btn.classList.add(ok?"right":"wrong");
  const z=btn.querySelector(".zh"); if(z) z.textContent=zhText;
  Say(sayText);
  const key=W.item.type+":"+W.item.k;
  if(!WTRIED){ WTRIED=true; DB.w[key]= ok ? (DB.w[key]||0)+1 : 0; save(); }
  if(ok){
    [...opts.children].forEach(b=>{ if(!b.dataset.done) b.dataset.done="1"; });
    $("w-ok").textContent="🎉 "+label(W.item.k)+"　"+(ZH[W.item.k]||"");
    $("w-ok").classList.add("on");
    $("w-after").style.display="flex";
  }
}

let L=null;
function newListen(){
  Say.stop(); $("l-after").style.display="none"; $("l-txt").classList.add("hidden");
  const scene=$("l-scene"), kind=rnd(["find","touch","give"]); setBG(scene,rnd(BG));

  if(kind==="find"){
    const keys=shuffle(Object.keys(NOUNS)).slice(0,3), target=rnd(keys);
    L={text:`Find the ${label(target)}.`,tip:"听一听，点出说的那样东西"};
    keys.forEach((k,i)=>{
      const d=document.createElement("div");
      d.className="obj free"; d.textContent=EMO(k);
      d.style.left=(22+i*28)+"%"; d.style.top="55%"; d.style.fontSize="15vmin";
      d.onclick=()=>lDone(k===target); scene.appendChild(d);
    });
  }
  if(kind==="touch"){
    const pr=pairDiff("poss"), a=pr[0], b=pr[1];
    const part=rnd(BODY_W.filter(p=>ANCHORS[sprite(a)]&&ANCHORS[sprite(a)][p]
                                  &&ANCHORS[sprite(b)]&&ANCHORS[sprite(b)][p]));
    L={text:`Touch ${A(a).pron.poss} ${part}.`,tip:"听清是谁的，再点那个人身上的位置"};
    [[a,32,false],[b,68,true]].forEach(([cid,x,fl])=>{
      const w=addChar(scene,cid,"neutral",x,fl);
      const h=pin(w,cid,part,"hot"); if(h)h.onclick=()=>lDone(cid===a);
    });
  }
  if(kind==="give"){
    const pr=pairDiff("obj"), a=pr[0], b=pr[1];
    const o=rnd(objsFor("give"));
    L={text:`Give ${A(a).pron.obj} the ${label(o)}.`,tip:"东西要给谁？点那个人"};
    const g=addChar(scene,"xiaotao","give",50,false); hold(g,"xiaotao",EMO(o),"give");
    [[a,17,false],[b,83,true]].forEach(([cid,x,fl])=>{
      const w=addChar(scene,cid,"receive",x,fl); w.onclick=()=>lDone(cid===a);
    });
  }
  $("l-txt").textContent=L.text; $("l-tip").textContent=L.tip;
  setTimeout(()=>Say(L.text),260);
}
function lDone(ok){
  if($("l-after").style.display==="flex")return;
  const v=$("l-verdict");
  if(ok){v.textContent="对了";v.className="verdict ok";bump();}
  else{v.textContent="再听一次";v.className="verdict";setTimeout(()=>Say(L.text),200);}
  $("l-after").style.display="flex";
}
$("l-play").onclick=()=>L&&Say(L.text);
$("l-eye").onclick=()=>$("l-txt").classList.toggle("hidden");
$("l-next").onclick=newListen;

let R=null,ANS=false;
function pairDiff(f){
  const p=shuffle(PRON3.slice());
  for(let i=0;i<p.length;i++) for(let j=0;j<p.length;j++)
    if(i!==j && A(p[i]).pron[f]!==A(p[j]).pron[f]) return [p[i],p[j]];
  return [PRON3[0],PRON3[1]];}
function fTransfer(){
  const [a,b]=pairDiff("subj"),o=rnd(objsFor("give")),bg=rnd(BG);
  const sc=(g,t)=>({bg,hold:{on:g,emoji:EMO(o)},
    chars:[{id:g,pose:"give",x:30},{id:t,pose:"receive",x:70,flip:true}]});
  return {sentence:`${subjWord(a)} gives ${A(b).pron.obj} the ${label(o)}.`,
          right:sc(a,b),wrong:sc(b,a),note:"谁在给、谁在接"};}
function fGender(){
  const [a,b]=pairDiff("subj"),bg=rnd(BG);
  let [pose,ing]=rnd([["run","running"],["sit","sitting"],["kick","kicking"],["point","pointing"]]);
  if(A(a).kind==="animal"||A(b).kind==="animal"){pose="neutral";ing="smiling";}
  return {sentence:`${subjWord(a)} ${A(a).be} ${ing}.`,
          right:{bg,chars:[{id:a,pose,x:50}]},wrong:{bg,chars:[{id:b,pose,x:50}]},note:"是谁"};}
function fPoss(){
  const [a,b]=pairDiff("poss"),bg=rnd(BG);
  const part=rnd(BODY_W.filter(p=>ANCHORS[sprite(a)]&&ANCHORS[sprite(a)][p]
                               &&ANCHORS[sprite(b)]&&ANCHORS[sprite(b)][p]));
  const base={bg,chars:[{id:a,pose:"neutral",x:32},{id:b,pose:"neutral",x:68,flip:true}]};
  return {sentence:`It is ${A(a).pron.poss} ${part}.`,
          right:Object.assign({},base,{ring:{on:a,part}}),
          wrong:Object.assign({},base,{ring:{on:b,part}}),note:"是谁的"};}
function draw(el,spec){
  setBG(el,spec.bg); const w={};
  spec.chars.forEach(c=>{w[c.id]=addChar(el,c.id,c.pose,c.x,!!c.flip);});
  if(spec.hold) hold(w[spec.hold.on],spec.hold.on,spec.hold.emoji,spec.hold.pose||"give");
  if(spec.ring) pin(w[spec.ring.on],spec.ring.on,spec.ring.part,"ring");}
function newRead(){
  Say.stop(); ANS=false; R=rnd([fTransfer,fGender,fPoss])();
  $("r-txt").textContent=R.sentence; $("r-after").style.display="none";
  const pair=$("r-pair"); pair.innerHTML="";
  shuffle(["right","wrong"]).forEach(k=>{
    const box=document.createElement("div"); box.className="opt"; box.dataset.k=k;
    const sc=document.createElement("div"); sc.className="scene";
    box.appendChild(sc); pair.appendChild(box); draw(sc,R[k]);
    box.onclick=()=>{ if(ANS)return; ANS=true;
      [...pair.children].forEach(b=>b.classList.add(b.dataset.k==="right"?"right":"wrong"));
      const v=$("r-verdict");
      if(k==="right"){v.textContent="对了";v.className="verdict ok";bump();}
      else{v.textContent="再看看："+R.note;v.className="verdict";}
      $("r-after").style.display="flex"; };
  });}
$("r-say").onclick=()=>R&&Say(R.sentence);
$("r-next").onclick=newRead;

  kick :{base:"kick", s:"kicks", pose:"kick", zh:"踢",   recip:false, need:["kick"]},
  eat  :{base:"eat",  s:"eats",  pose:"eat",  zh:"吃",   recip:false, need:["food"]},

  like :{base:"like", s:"likes", pose:"like", zh:"喜欢", recip:false, need:null},
  throw:{base:"throw",s:"throws",pose:"throw",zh:"扔",   recip:false, need:["throw"]},
  read :{base:"read", s:"reads", pose:"read", zh:"读",   recip:false, need:["read"]},

  carry:{base:"carry",s:"carries",pose:"carry",zh:"背",  recip:false, need:["carry"]},
  open :{base:"open", s:"opens", pose:"open", zh:"打开", recip:false, need:["open"]},
  push :{base:"push", s:"pushes",pose:"push", zh:"推",   recip:false, need:["push"]},
  pull :{base:"pull", s:"pulls", pose:"pull", zh:"拉",   recip:false, need:["push"]},
  jump :{base:"jump", s:"jumps", pose:"jump", zh:"跳",   recip:false, need:null, noObj:true},
  walk :{base:"walk", s:"walks", pose:"walk", zh:"走",   recip:false, need:null, noObj:true},
  sleep:{base:"sleep",s:"sleeps",pose:"sleep",zh:"睡觉", recip:false, need:null, noObj:true},
  wave :{base:"wave", s:"waves", pose:"wave", zh:"挥手", recip:false, need:null, noObj:true},
  brush:{base:"brush",s:"brushes",pose:"brush",zh:"刷牙", recip:false, need:null, noObj:true},
  count:{base:"count",s:"counts",pose:"count",zh:"数数", recip:false, need:null, noObj:true}
};
function okObj(v,o){const V=SAY_VERBS[v]; if(!V) return false; if(V.noObj) return true;
  return !V.need || V.need.some(t=>NOUNS[o].t.includes(t));}
function objsFor(v){return Object.keys(NOUNS).filter(o=>okObj(v,o));}
function vForm(v,id){return A(id).s3 ? SAY_VERBS[v].s : SAY_VERBS[v].base;}

const ACTORS=["xiaotao","you","meimei","ani","eason","xinxin","ashan"];
const NAME={xiaotao:"小萄",you:"你",meimei:"梅梅",ani:"阿妮",eason:"Eason",xinxin:"心心",ashan:"阿扇"};
let SMODE="free";
let F={bg:"classroom",subj:"ani",verb:"give",recip:"meimei",obj:"ball"};

function engOf(st){
  const v=SAY_VERBS[st.verb]; if(!v) return "";
  if(!A(st.subj)) return "";
  const sw=subjWord(st.subj), vf=vForm(st.verb,st.subj);
  if(v.recip && !A(st.recip)) return "";
  if(!v.noObj && !NOUNS[st.obj]) return "";
  if(v.noObj) return `${sw} ${vf}.`;
  if(v.recip) return `${sw} ${vf} ${A(st.recip).pron.obj} the ${label(st.obj)}.`;
  if(st.verb==="like") return `${sw} ${vf} ${label(st.obj)}s.`;
  return `${sw} ${vf} the ${label(st.obj)}.`;
}
function zhOf(st){
  const v=SAY_VERBS[st.verb]; if(!v||!A(st.subj)) return "";
  const sw=A(st.subj).zh.s, o=ZH[st.obj]||st.obj;
  if(v.recip && !A(st.recip)) return "";
  if(v.noObj) return `${sw}${v.zh}。`;
  if(v.recip) return `${sw}把${o}给${A(st.recip).zh.o}。`;
  return `${sw}${v.zh}${o}。`;
}
function tagPerson(wrap,id){
  const p=A(id).person; if(p===3) return;
  const d=document.createElement("div");
  d.className="obj"; d.textContent = p===1 ? "💬" : "👉";
  d.style.left="50%"; d.style.top="-6%"; wrap.appendChild(d);
}
function drawState(st){
  const scene=$("s-scene"); if(!scene) return;
  setBG(scene,st.bg);
  const v=SAY_VERBS[st.verb];
  if(!v||!A(st.subj)) return;
  if(v.recip && !A(st.recip)) return;
  if(v.recip){
    const g=addChar(scene,st.subj,"give",30,false); hold(g,st.subj,EMO(st.obj),"give"); tagPerson(g,st.subj);
    const r=addChar(scene,st.recip,"receive",70,true); tagPerson(r,st.recip);
  }else{
    const g=addChar(scene,st.subj,v.pose,50,false); hold(g,st.subj,EMO(st.obj),"give"); tagPerson(g,st.subj);
  }
}
function chipRow(host,title,items,cur,set){

  host.appendChild(row);
}

    const go=$("ai-go"); if(!go) return;

      const t=$("ai-in").value.trim(); if(!t) return;
      $("ai-msg").textContent="在想…";
      const r=await aiScene(t);
      if(r.err){ $("ai-msg").textContent=r.err; return; }
      F=r; renderFree(); Say(engOf(F));
    };
  },0);
  chipRow(bank,"在哪里",[["classroom","教室"],["kitchen","厨房"],["park","公园"],["playground","操场"]],
          F.bg,x=>F.bg=x);
  chipRow(bank,"谁",ACTORS.map(a=>[a,NAME[a]+" <small>"+subjWord(a)+"</small>"]),
          F.subj,x=>{F.subj=x; if(F.recip===x)F.recip=ACTORS.find(y=>y!==x);});
  chipRow(bank,"做什么",Object.keys(SAY_VERBS).map(k=>[k,vForm(k,F.subj)]),F.verb,
          x=>{F.verb=x; if(!okObj(x,F.obj)) F.obj=objsFor(x)[0];});
  if(v.recip)
    chipRow(bank,"给谁",ACTORS.filter(a=>a!==F.subj)
            .map(a=>[a,NAME[a]+" <small>"+A(a).pron.obj+"</small>"]),F.recip,x=>F.recip=x);
  if(!v.noObj) chipRow(bank,"什么",objsFor(F.verb).map(k=>[k,EMO(k)+" "+label(k)]),F.obj,x=>F.obj=x);
}

/* ---------- 照中文说 ---------- */
let T=null, PICK=null;
function newZh(){
  const verb=rnd(Object.keys(SAY_VERBS));
  const subj=rnd(ACTORS);
  const recip=rnd(ACTORS.filter(a=>a!==subj));
  T={bg:rnd(BG),subj,verb,recip,obj:rnd(objsFor(verb).length?objsFor(verb):["ball"])};
  PICK={subj:null,verb:null,recip:null,obj:null};
  renderZh();
}
function renderZh(){
  const v=SAY_VERBS[T.verb];
  $("s-tip").textContent="按中文，一个一个选出英文";
  const st=Object.assign({},T,{subj:PICK.subj||T.subj,recip:PICK.recip||T.recip,
                               obj:PICK.obj||T.obj,verb:PICK.verb||T.verb});
  if(!okObj(st.verb,st.obj)) st.obj=objsFor(st.verb)[0];
  drawState(st);

  const slots=$("s-slots"); slots.innerHTML="";
  const zh=document.createElement("div"); zh.className="slot";
  zh.style.fontSize="20px"; zh.textContent=zhOf(T); slots.appendChild(zh);

  const seq=[["subj","谁"],["verb","做什么"]]
    .concat(v.recip?[["recip","给谁"]]:[]).concat(v.noObj?[]:[["obj","什么"]]);
  seq.forEach(([k,lab])=>{
    const d=document.createElement("div"); d.className="slot";
    let t="___";
    if(PICK[k]!==null){
      t = k==="subj" ? subjWord(PICK[k])
        : k==="recip"? A(PICK[k]).pron.obj
        : k==="verb" ? vForm(PICK[k], PICK.subj||T.subj)
        : "the "+label(PICK[k]);
    }
    d.innerHTML=`<span>${t}</span><small>${lab}</small>`;
    d.onclick=()=>{ PICK[k]=null; renderZh(); };
    slots.appendChild(d);
  });

  const bar=$("s-bar"); bar.innerHTML="";
  const done=seq.every(([k])=>PICK[k]!==null);
  if(done){
    const st2=Object.assign({},T);
    Object.keys(PICK).forEach(function(k){ if(PICK[k]!==null) st2[k]=PICK[k]; });
    const ok = seq.every(([k])=>{
      if(k==="subj") return A(PICK.subj).pron.subj===A(T.subj).pron.subj;
      if(k==="recip")return A(PICK.recip).pron.obj===A(T.recip).pron.obj;
      return PICK[k]===T[k];
    });
    const b=document.createElement("button");
    b.className=ok?"read":"did"; b.style.flex="2";
    b.textContent=(ok?"✓ ":"")+engOf(st2);
    b.onclick=()=>{ Say(engOf(st2)); if(ok){bump();newZh();} };
    bar.appendChild(b);
    const n=document.createElement("button"); n.className="did"; n.textContent="换一句";
    n.onclick=newZh; bar.appendChild(n);
  }else{
    const b=document.createElement("button"); b.className="did"; b.textContent="换一句";
    b.onclick=newZh; bar.appendChild(b);
  }

  const bank=$("s-bank"); bank.innerHTML="";
  const next=seq.find(([k])=>PICK[k]===null);
  if(!next) return;
  const k=next[0];
  const subjNow=PICK.subj||T.subj;
  if(k==="subj")
    chipRow(bank,"选：谁",ACTORS.map(a=>[a,subjWord(a)]),null,
      x=>{PICK.subj=x;Say(subjWord(x));renderZh();});
  if(k==="verb")
    chipRow(bank,"选：做什么",Object.keys(SAY_VERBS).map(x=>[x,vForm(x,subjNow)]),null,
      x=>{PICK.verb=x;Say(vForm(x,subjNow));renderZh();});
  if(k==="recip")
    chipRow(bank,"选：给谁",ACTORS.filter(a=>a!==subjNow).map(a=>[a,A(a).pron.obj]),null,
      x=>{PICK.recip=x;Say(A(x).pron.obj);renderZh();});
  if(k==="obj")
    chipRow(bank,"选：什么",objsFor(PICK.verb||T.verb).slice(0,10).map(x=>[x,EMO(x)+" "+label(x)]),null,
      x=>{PICK.obj=x;Say(label(x));renderZh();});
}

/* ---------- 中文一句话 → 舞台（可选，走 DeepSeek） ---------- */
async function aiScene(text){
  const key=DB.apikey;
  if(!key) return {err:"还没填 API key（右上角齿轮里填）"};
  const menu={
    scene:BG, actor:ACTORS, verb:Object.keys(SAY_VERBS), object:Object.keys(NOUNS)
  };
  const sys="You convert a short Chinese sentence into a scene spec. "+
    "Reply with ONE JSON object and nothing else, no markdown. "+
    "Keys: scene, subj, verb, recip, obj. "+
    "Every value MUST be chosen from this menu: "+JSON.stringify(menu)+". "+
    "actor meaning: xiaotao=我/小萄, you=你, meimei=他/爸爸/梅梅, ani=她/妈妈/阿妮, "+
    "eason=Eason, xinxin=心心, ashan=它/鳐鱼/阿扇. "+
    "Use recip only when verb is give, otherwise set recip to null. "+
    "Pick the closest available object; never invent one.";
  try{
    const r=await fetch("https://api.deepseek.com/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({
        model:"deepseek-flash",
        thinking:{type:"disabled"},
        temperature:0,
        response_format:{type:"json_object"},
        messages:[{role:"system",content:sys},{role:"user",content:text}]})
    });
    if(!r.ok) return {err:"接口返回 "+r.status};
    const d=await r.json();
    const raw=(d.choices&&d.choices[0]&&d.choices[0].message.content||"").replace(/```json|```/g,"").trim();
    const j=JSON.parse(raw);
    if(!SAY_VERBS[j.verb]||!NOUNS[j.obj]) return {err:"没听懂，换个说法试试"};
    if(!ACTORS.includes(j.subj)) j.subj="meimei";
    if(!okObj(j.verb,j.obj)) j.obj=objsFor(j.verb)[0];
    if(SAY_VERBS[j.verb].recip && !ACTORS.includes(j.recip))
      j.recip=ACTORS.find(a=>a!==j.subj);
    return {bg:BG.includes(j.scene)?j.scene:"classroom",
            subj:j.subj,verb:j.verb,recip:j.recip,obj:j.obj};
  }catch(e){ return {err:"出错了："+e.message}; }
}

function renderSay(){ SMODE==="free" ? renderFree() : renderZh(); }
$("m-free").onclick=()=>{SMODE="free";$("m-free").classList.add("on");$("m-zh").classList.remove("on");renderSay();};
$("m-zh").onclick=()=>{SMODE="zh";$("m-zh").classList.add("on");$("m-free").classList.remove("on");newZh();};



/* ================= 路由 ================= */
const CRUMB={home:"",menu:"练习",wordcat:"练习 / 词",settings:"设置",
             word:"词",listen:"听",read:"读",say:"说"};
let CUR="home", PREV=[];

function show(sec){
  ["sc-home","sc-menu","sc-wordcat","sc-settings","sc-play"].forEach(id=>{
    $(id).classList.toggle("on", id===sec);
  });
}
function view(v){
  ["word","listen","read","say"].forEach(n=>{
    $("v-"+n).style.display = (n===v) ? "block" : "none";
  });
}
function nav(to,push){
  Say.stop();
  if(push!==false && to!==CUR) PREV.push(CUR);
  CUR=to;
  $("bar-crumb").textContent=CRUMB[to]||"";
  $("back").style.display = (to==="home") ? "none" : "block";
  if(to==="home"){ show("sc-home"); PREV=[]; return; }
  if(to==="menu"){ show("sc-menu"); return; }
  if(to==="wordcat"){ show("sc-wordcat"); return; }
  if(to==="settings"){ show("sc-settings"); syncSettings(); return; }
  show("sc-play"); view(to);
  if(to==="word") newWord();
  if(to==="listen") newListen();
  if(to==="read") newRead();
  if(to==="say"){ SMODE="free"; $("m-free").classList.add("on"); $("m-zh").classList.remove("on"); renderSay(); }
}
$("go-play").onclick=()=>nav("menu");
$("go-set").onclick=()=>nav("settings");
$("back").onclick=()=>{ const p=PREV.pop()||"home"; nav(p,false); CUR=p;
  $("bar-crumb").textContent=CRUMB[p]||""; $("back").style.display=(p==="home")?"none":"block"; };
document.querySelectorAll("[data-go]").forEach(b=>{
  b.onclick=()=>{ const g=b.dataset.go; if(g==="word") nav("wordcat"); else nav(g); };
});
document.querySelectorAll("[data-cat]").forEach(b=>{
  b.onclick=()=>{ WCAT=b.dataset.cat; nav("word"); };
});

/* 左上角头像 → 回首页确认 */
$("ava").onclick=()=>{ if(CUR!=="home") $("confirm").classList.add("on"); };
$("c-stay").onclick=()=>$("confirm").classList.remove("on");
$("c-go").onclick=()=>{ $("confirm").classList.remove("on"); nav("home",false); };

/* ================= 设置 ================= */
function syncSettings(){
  const sel=$("voice"); sel.innerHTML="";
  const vs=Say.voices();
  vs.forEach(v=>{ const o=document.createElement("option");
    o.value=v.name; o.textContent=v.name+" ("+v.lang+")"; sel.appendChild(o); });
  if(!vs.length){ const o=document.createElement("option");
    o.textContent="系统没有英语语音"; sel.appendChild(o); }
  if(DB.voice) Say.pickVoice(DB.voice);
  sel.value=Say.current();
  $("rate").value=Math.round(Say.rate()*100);
  $("ratev").textContent=Say.rate().toFixed(2);
  $("apikey").value=DB.apikey||"";
  document.querySelectorAll("#lvseg button").forEach(b=>{
    b.classList.toggle("on", +b.dataset.lv===(DB.lv||1));
  });
  $("lvnote").textContent="当前词库共 "+wordPool("all").length+" 个词："+
    "名词 "+wordPool("noun").length+"、动作 "+wordPool("verb").length+
    "、形容词 "+wordPool("adj").length+"、身体 "+BODY_W.length+
    "、情绪 "+Object.keys(EMO_W).length+"。";
}
$("voice").onchange=e=>{ Say.pickVoice(e.target.value); DB.voice=e.target.value; save();
  Say("She gives him the ball."); };
$("rate").oninput=e=>{ const r=e.target.value/100; Say.setRate(r); DB.rate=r; save();
  $("ratev").textContent=r.toFixed(2); };
$("try").onclick=()=>Say("She gives him the ball.");
$("apikey").oninput=e=>{ DB.apikey=e.target.value.trim(); save(); };
document.querySelectorAll("#lvseg button").forEach(b=>{
  b.onclick=()=>{ DB.lv=+b.dataset.lv; save(); syncSettings(); };
});
if(DB.rate) Say.setRate(DB.rate);

if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged=function(){
    try{ Say.reload(); if(CUR==="settings") syncSettings(); }catch(e){}
  };
}

nav("home",false);
